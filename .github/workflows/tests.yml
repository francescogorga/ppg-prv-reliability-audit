name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - run: python -m pip install -r analysis/requirements.txt
      - run: python -m pip check
      - run: python -m pytest analysis/tests/
